name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
      pull-requests: write # the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Pull requests opened with GITHUB_TOKEN do not trigger CI. To have CI
          # run on the release pull request, add a repository secret
          # RELEASE_PLEASE_TOKEN (a GitHub App token is preferable to a personal one).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Publish image to ghcr.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push with the built-in GITHUB_TOKEN, no personal token
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      # The tag, not the commit that triggered this run: a newer push may have
      # replaced the run that created the release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Image name (lowercase) and released commit
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=outbound-smtp
            org.opencontainers.image.description=Outbound-only SMTP relay with DKIM signing
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} # source, version, revision, licenses
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            COMMIT=${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Attach static binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build linux/amd64 and linux/arm64
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir dist
          commit="$(git rev-parse HEAD)" # the tagged commit
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${commit}" \
              -o "dist/outbound-smtp_${VERSION}_linux_${arch}" ./cmd/outbound-smtp
          done
          cd dist && sha256sum outbound-smtp_* > checksums.txt
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
