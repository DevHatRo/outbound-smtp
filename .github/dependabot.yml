version: 2
# One grouped PR per ecosystem for minor and patch updates, one for majors.
updates:
  # "fix" so that dependency updates in the shipped binary and image produce a release.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
      go-major:
        update-types: ["major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-major:
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
